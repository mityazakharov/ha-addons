configuration:
  primary_link:
    name: Primary link
    description: vless:// or ss:// link from your VPN app
  backup_link:
    name: Backup link
    description: Optional. Used when the primary link stops working
  test_url:
    name: Test URL
    description: Checked through each link once a minute
  log_level:
    name: Log level
network:
  1080/tcp: SOCKS5/HTTP proxy. Do not expose to the LAN unless needed
